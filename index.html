<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday!</title>
  <!-- Google Fonts for the Serif Typography -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #fbf9f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Playfair Display', Georgia, serif;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
    }

    /* Heading Typography */
    h1 {
      font-size: 2.5rem;
      font-weight: 500;
      color: #2f2f2f;
      margin-bottom: 18px;
      letter-spacing: -0.5px;
      text-align: center;
    }

    h1 span {
      font-style: italic;
      color: #7d6b91;
    }

    /* Arch Container */
    .arch-card {
      position: relative;
      width: 250px;
      height: 185px;
      background: linear-gradient(180deg, #f5effa 0%, #e5d7f2 100%);
      border-radius: 130px 130px 18px 18px;
      box-shadow: 0 8px 24px rgba(125, 107, 145, 0.08);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      overflow: hidden;
    }

    /* SVG Illustration Scaling */
    .cake-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Floating Balloons Animation */
    .balloon {
      animation: float 4s ease-in-out infinite;
    }
    .balloon-1 { animation-delay: 0s; }
    .balloon-2 { animation-delay: 1s; }
    .balloon-3 { animation-delay: 0.5s; }
    .balloon-4 { animation-delay: 1.5s; }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    /* Animated Cake Layers */
    .step {
      opacity: 0;
      transform: translateY(-15px) scale(0.95);
      transform-origin: center bottom;
      transition: opacity 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
                  transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .step.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Flame Flicker */
    .flame-group {
      opacity: 0;
      transform: scale(0);
      transform-origin: 125px 38px;
      transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .flame-group.visible {
      opacity: 1;
      transform: scale(1);
      animation: flicker 1.2s ease-in-out infinite alternate;
    }

    @keyframes flicker {
      0% { transform: scale(1) rotate(-2deg); }
      50% { transform: scale(1.06, 0.96) rotate(2deg); }
      100% { transform: scale(0.97, 1.05) rotate(-1deg); }
    }

    /* Bottom Dots Indicator */
    .dots {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: #dcd3e5;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .dot.active {
      background-color: #9b87b2;
      transform: scale(1.25);
    }
  </style>
</head>
<body>

  <h1>Happy <span>Birthday!</span></h1>

  <div class="arch-card" id="card">
    <svg class="cake-svg" viewBox="0 0 250 185" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Gradients for Cake & Stand -->
        <linearGradient id="standTop" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#d7c2e8"/>
          <stop offset="50%" stop-color="#efe5f7"/>
          <stop offset="100%" stop-color="#c3a6db"/>
        </linearGradient>
        <linearGradient id="standBase" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#b695d1"/>
          <stop offset="50%" stop-color="#d0b7e6"/>
          <stop offset="100%" stop-color="#9e7bb8"/>
        </linearGradient>
        <linearGradient id="spongeGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#f2c19e"/>
          <stop offset="50%" stop-color="#fad4b8"/>
          <stop offset="100%" stop-color="#e5ae88"/>
        </linearGradient>
        <linearGradient id="icingGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#fcf8f2"/>
          <stop offset="50%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#f2ece1"/>
        </linearGradient>
        <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffea85" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#ffae42" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- BACKGROUND BALLOONS -->
      <!-- Top Left Purple Balloon -->
      <g class="balloon balloon-1">
        <path d="M35,102 Q32,125 42,145" stroke="#d5c5e3" stroke-width="1" fill="none"/>
        <ellipse cx="35" cy="85" rx="14" ry="17" fill="#9c6b98" opacity="0.85"/>
      </g>
      <!-- Bottom Left Blue Balloon -->
      <g class="balloon balloon-2">
        <path d="M18,145 Q22,160 28,175" stroke="#d5c5e3" stroke-width="1" fill="none"/>
        <ellipse cx="18" cy="130" rx="13" ry="16" fill="#a9d1e6" opacity="0.85"/>
      </g>
      <!-- Top Right Coral Balloon -->
      <g class="balloon balloon-3">
        <path d="M215,105 Q218,125 208,148" stroke="#d5c5e3" stroke-width="1" fill="none"/>
        <ellipse cx="215" cy="88" rx="14" ry="17" fill="#f29b8f" opacity="0.85"/>
      </g>
      <!-- Bottom Right Yellow Balloon -->
      <g class="balloon balloon-4">
        <path d="M232,146 Q225,162 218,175" stroke="#d5c5e3" stroke-width="1" fill="none"/>
        <ellipse cx="232" cy="130" rx="13" ry="16" fill="#fae09c" opacity="0.9"/>
      </g>

      <!-- CAKE STAND (Always Visible) -->
      <g id="cake-stand">
        <!-- Pedestal Base -->
        <path d="M108,174 C112,162 117,150 117,142 L133,142 C133,150 138,162 142,174 Z" fill="url(#standBase)"/>
        <ellipse cx="125" cy="174" rx="26" ry="5.5" fill="url(#standBase)"/>
        <ellipse cx="125" cy="173" rx="24" ry="4" fill="#d9c3ec"/>
        <!-- Stand Plate Shadow & Rim -->
        <ellipse cx="125" cy="141" rx="74" ry="14" fill="url(#standBase)"/>
        <ellipse cx="125" cy="138" rx="74" ry="13" fill="url(#standTop)"/>
        <ellipse cx="125" cy="137" rx="64" ry="10" fill="#e5d4f2"/>
      </g>

      <!-- STEP 1: SPONGE CAKE LAYERS -->
      <g id="step-sponge" class="step">
        <!-- Cake Shadow on Plate -->
        <ellipse cx="125" cy="137" rx="56" ry="9" fill="#b89cd1" opacity="0.4"/>
        <!-- Lower Sponge Body -->
        <path d="M71,96 L71,134 A54,9 0 0,0 179,134 L179,96 Z" fill="url(#spongeGrad)"/>
        <!-- Middle Filling Line -->
        <path d="M71,115 A54,9 0 0,0 179,115 L179,119 A54,9 0 0,1 71,119 Z" fill="#cb8b69"/>
        <!-- Sponge Top Surface -->
        <ellipse cx="125" cy="96" rx="54" ry="9" fill="#f7d5ba"/>
      </g>

      <!-- STEP 2: WHITE FROSTING & SPRINKLES -->
      <g id="step-icing" class="step">
        <!-- Scalloped Drip Frosting Side -->
        <path d="M69,95
                 C69,106 75,112 78,112
                 C82,112 83,103 87,103
                 C91,103 92,116 97,116
                 C102,116 103,104 108,104
                 C113,104 114,113 119,113
                 C124,113 126,103 131,103
                 C136,103 137,117 142,117
                 C147,117 149,105 154,105
                 C159,105 160,113 165,113
                 C169,113 171,104 174,104
                 C177,104 179,110 181,104
                 L181,95 Z" fill="url(#icingGrad)"/>
        <!-- Frosting Top Surface -->
        <ellipse cx="125" cy="95" rx="56" ry="10" fill="#fffdf9"/>
        
        <!-- Sprinkles -->
        <circle cx="95" cy="94" r="1.5" fill="#e5989b"/>
        <circle cx="110" cy="90" r="1.3" fill="#b5838d"/>
        <circle cx="128" cy="92" r="1.5" fill="#f4a261"/>
        <circle cx="145" cy="91" r="1.4" fill="#9b6b9e"/>
        <circle cx="160" cy="95" r="1.5" fill="#e5989b"/>
        <circle cx="105" cy="98" r="1.4" fill="#f4a261"/>
        <circle cx="136" cy="99" r="1.3" fill="#e5989b"/>
        <circle cx="118" cy="96" r="1.2" fill="#81b29a"/>
        <circle cx="85" cy="97" r="1.3" fill="#9b6b9e"/>
      </g>

      <!-- STEP 3: CANDLE -->
      <g id="step-candle" class="step">
        <!-- Candle Base Shadow -->
        <ellipse cx="125" cy="92" rx="6" ry="2" fill="#e2d9c8"/>
        <!-- Candle Stick -->
        <rect x="120" y="48" width="10" height="44" rx="2" fill="#ffffff"/>
        <!-- Purple Diagonal Stripes -->
        <path d="M120,56 L130,50 L130,56 L120,62 Z" fill="#9e7bb8"/>
        <path d="M120,68 L130,62 L130,68 L120,74 Z" fill="#9e7bb8"/>
        <path d="M120,80 L130,74 L130,80 L120,86 Z" fill="#9e7bb8"/>
        <!-- Candle Wick -->
        <line x1="125" y1="48" x2="125" y2="43" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
      </g>

      <!-- STEP 4: CANDLE FLAME -->
      <g id="step-flame" class="flame-group">
        <!-- Outer Glow -->
        <circle cx="125" cy="34" r="18" fill="url(#flameGlow)"/>
        <!-- Outer Flame -->
        <path d="M125,18 C119,28 118,38 125,43 C132,38 131,28 125,18 Z" fill="#ffad42"/>
        <!-- Inner Flame -->
        <path d="M125,24 C121,31 121,38 125,42 C129,38 129,31 125,24 Z" fill="#fff394"/>
      </g>
    </svg>
  </div>

  <!-- Subtle Pagination Dots -->
  <div class="dots">
    <div class="dot active" id="dot-1"></div>
    <div class="dot" id="dot-2"></div>
  </div>

  <script>
    const sponge = document.getElementById('step-sponge');
    const icing = document.getElementById('step-icing');
    const candle = document.getElementById('step-candle');
    const flame = document.getElementById('step-flame');
    const dot1 = document.getElementById('dot-1');
    const dot2 = document.getElementById('dot-2');

    let isAnimating = false;

    // Confetti Colors Matching the Video's Earthy & Pastel Palette
    const confettiColors = ['#6b4c7a', '#c9a66b', '#d98a7c', '#8c7a99', '#e3c18d', '#a386b8'];

    function fireSideConfetti() {
      const duration = 2600;
      const end = Date.now() + duration;

      (function frame() {
        // Left side burst
        confetti({
          particleCount: 4,
          angle: 45,
          spread: 65,
          origin: { x: 0, y: 0.75 },
          colors: confettiColors,
          ticks: 250,
          gravity: 0.7,
          scalar: 0.75,
          drift: 0.5
        });
        // Right side burst
        confetti({
          particleCount: 4,
          angle: 135,
          spread: 65,
          origin: { x: 1, y: 0.75 },
          colors: confettiColors,
          ticks: 250,
          gravity: 0.7,
          scalar: 0.75,
          drift: -0.5
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      })();
    }

    function runCakeSequence() {
      if (isAnimating) return;
      isAnimating = true;

      // Reset all layers
      sponge.classList.remove('visible');
      icing.classList.remove('visible');
      candle.classList.remove('visible');
      flame.classList.remove('visible');
      dot1.classList.remove('active');
      dot2.classList.add('active');

      // Step 1: Sponge Cake Appears
      setTimeout(() => {
        sponge.classList.add('visible');
      }, 600);

      // Step 2: Frosting & Sprinkles Appear
      setTimeout(() => {
        icing.classList.add('visible');
      }, 1300);

      // Step 3: Candle Appears
      setTimeout(() => {
        candle.classList.add('visible');
      }, 2000);

      // Step 4: Flame Lights Up + Confetti Bursts from Both Sides
      setTimeout(() => {
        flame.classList.add('visible');
        dot2.classList.remove('active');
        dot1.classList.add('active');
        fireSideConfetti();
      }, 2600);

      // Allow replay or loop after completion
      setTimeout(() => {
        isAnimating = false;
      }, 6500);
    }

    // Start automatically on page load and loop every 9.5 seconds like the video
    window.addEventListener('DOMContentLoaded', () => {
      runCakeSequence();
      setInterval(runCakeSequence, 9500);
    });

    // Also allow clicking anywhere on the screen to replay immediately
    document.body.addEventListener('click', () => {
      isAnimating = false;
      runCakeSequence();
    });
  </script>
</body>
</html>
